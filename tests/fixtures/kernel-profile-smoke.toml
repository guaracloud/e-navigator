log_level = "info"
queue_capacity = 256

[[modules]]
name = "source.aya_cpu_profile"
enabled = true

[[modules]]
name = "sink.json_stdout"
enabled = true

[cpu_profile_source]
enabled = true
module_name = "source.aya_cpu_profile"
sample_frequency_hz = 49
off_cpu_enabled = false
lock_enabled = false
kernel_stacks_enabled = true
max_active_targets = 8
max_frames_per_sample = 32
max_kernel_frames_per_sample = 16
max_samples_per_batch = 32
max_symbol_bytes = 256
max_module_bytes = 256
max_file_bytes = 256
backpressure = "drop_newest"
symbolize = true
resolve_symbol_names = true
dwarf_unwind = false

log_level = "info"
queue_capacity = 1024

[ebpf]
event_transport = "perf_buffer"

[attribution]
procfs_root = "/host/proc"
cgroup_root = "/sys/fs/cgroup"

[attribution.kubernetes]
enabled = false

[http_source]
max_header_bytes = 8192
max_request_line_bytes = 1024
max_attributes = 8
max_tracestate_bytes = 512
inbound_enabled = true

[http_source.context_propagation]
enabled = true
plaintext_ports = [18080, 18081]
max_tracked_sockets = 128
context_pool_capacity = 128
same_thread_context_ttl_millis = 30000

[json_stdout]
mode = "all"

[[modules]]
name = "source.aya_http"
enabled = true

[[modules]]
name = "sink.json_stdout"
enabled = true
